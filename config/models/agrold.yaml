# Vocabulary profile: AgroLD.
#
# Classes are named with the AgroLD vocabulary (Gene, Transcript, Protein,
# Exon — no `Ensembl` prefix), while properties follow the Ensembl
# recommendations, so the output stays faithful to the Ensembl RDF model while
# fitting into the AgroLD graph. Use with -b http://purl.agrold.org.
#
# Reference: AgroLD_ETL/model/agrold-schema_latest.tab, agrold_schema.owl;
# Ensembl model: rdf-config/model.yaml.
# Classes and properties of the model live in the AgroLD vocabulary, so nothing
# is left under rdf.ebi.ac.uk. Overridden by -t / --terms-uri.
vocabulary:
  prefix: agrold_vocabulary
  uri: http://purl.agrold.org/vocabulary/

# Resource URIs, without `ensembl` in the path. `{base}` is replaced by
# --base-uri, so these read http://purl.agrold.org/resource/...
resources:
  gene:       {prefix: gene,       uri: "{base}/resource/"}
  transcript: {prefix: transcript, uri: "{base}/resource/transcript/"}
  protein:    {prefix: protein,    uri: "{base}/resource/protein/"}
  exon:       {prefix: exon,       uri: "{base}/resource/exon/"}
  chromosome: {uri: "{base}/resource/chromosome/"}

terms:
  # classes: AgroLD vocabulary, named after the feature
  gene_class: agrold_vocabulary:Gene
  transcript_class: agrold_vocabulary:Transcript
  protein_class: agrold_vocabulary:Protein
  exon_class: agrold_vocabulary:Exon
  chromosome_class: agrold_vocabulary:Chromosome
  chromosome_so_class: obo:SO_0000340
  exon_so_class: obo:SO_0000147            # second type of an exon
  ordered_exon_class: agrold_vocabulary:OrderedExon
  ordered_list_item_class: sio:SIO_001261
  versioned_transcript_class: agrold_vocabulary:VersionedTranscript

  # properties: Ensembl recommendations, with the Ensembl-specific ones
  # (terms:) republished in the AgroLD vocabulary
  label: rdfs:label
  description: dcterms:description
  identifier: dcterms:identifier
  alt_label: skos:altLabel
  see_also: rdfs:seeAlso
  in_taxon: obo:RO_0002162
  location: faldo:location

  has_biotype: agrold_vocabulary:has_biotype
  part_of: so:part_of                      # gene/transcript -> chromosome
  transcribed_from: so:transcribed_from    # transcript -> gene
  translates_to: so:translates_to          # transcript -> protein
  translation_of: so:translation_of        # protein -> transcript
  has_exon: so:has_part                    # transcript -> exon
  has_ordered_exon: sio:SIO_000974         # transcript -> ordered exon
  ordered_exon_refers_to: sio:SIO_000628   # ordered exon -> exon
  ordered_exon_rank: sio:SIO_000300        # rank value

  in_assembly: agrold_vocabulary:inAssembly
  in_schema_number: agrold_vocabulary:inSchemaNumber

  has_transcript_flag: agrold_vocabulary:has_transcript_flag
  has_versioned_transcript: agrold_vocabulary:has_versioned_transcript
  has_version: agrold_vocabulary:has_version
  has_counterpart: agrold_vocabulary:has_counterpart

options:
  # The biotype stays an ontology term (ENSGLOSSARY, SO or the vocabulary's own
  # class), as the Ensembl model recommends, both as rdf:type and as object of
  # has_biotype — which agrold_schema.owl therefore declares as an
  # owl:ObjectProperty, unlike the other AgroLD parsers that write a string.
  # Regions keyed by taxon and assembly, as in the AgroLD graph
  chromosome_pattern: "{taxon}/{assembly}/{chromosome}"
  chromosome_lrg_pattern: "{taxon}/{chromosome}"
  # Regions and positions as named resources, so features sharing coordinates
  # share them: <chromosome>:<begin>-<end>:<strand>
  faldo_named_regions: true
  biotype_as_literal: false
  biotype_as_type: true
