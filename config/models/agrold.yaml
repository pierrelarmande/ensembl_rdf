# Vocabulary profile: AgroLD.
#
# Keeps the Ensembl modelling (FALDO locations, ordered exons, transcript
# flags) but expresses it with the AgroLD vocabulary, so the output can be
# loaded into the AgroLD graph. Use with -b http://purl.agrold.org.
#
# Reference: AgroLD_ETL/model/agrold-schema_latest.tab, agrold_schema.owl and
# riceKB/ensemblParser.py.
prefixes:
  agrold_vocabulary: http://purl.agrold.org/vocabulary/

terms:
  # classes: AgroLD names them after the feature, without an Ensembl prefix
  gene_class: agrold_vocabulary:Gene
  transcript_class: agrold_vocabulary:mRNA
  protein_class: agrold_vocabulary:Protein
  exon_class: agrold_vocabulary:Exon
  exon_so_class: obo:SO_0000147
  ordered_exon_class: agrold_vocabulary:OrderedExon     # not in the AgroLD schema yet
  ordered_list_item_class: sio:SIO_001261
  versioned_transcript_class: agrold_vocabulary:VersionedTranscript  # not in the AgroLD schema yet

  # common properties
  label: rdfs:label
  description: agrold_vocabulary:description
  identifier: dcterms:identifier
  alt_label: agrold_vocabulary:has_synonym
  see_also: agrold_vocabulary:has_dbxref
  in_taxon: obo:RO_0002162
  location: faldo:location

  # structural relations
  has_biotype: agrold_vocabulary:has_biotype
  part_of: agrold_vocabulary:is_located_on
  transcribed_from: sio:SIO_010081          # is transcribed from
  translates_to: sio:SIO_010082             # is translated into
  translation_of: sio:SIO_010083            # is translated from
  has_exon: agrold_vocabulary:has_part
  has_ordered_exon: sio:SIO_000974
  ordered_exon_refers_to: sio:SIO_000628
  ordered_exon_rank: sio:SIO_000300

  # transcript flags: no AgroLD counterpart yet
  has_transcript_flag: agrold_vocabulary:has_transcript_flag
  has_versioned_transcript: agrold_vocabulary:has_versioned_transcript
  has_version: agrold_vocabulary:has_version
  has_counterpart: agrold_vocabulary:has_counterpart

options:
  biotype_as_literal: false
  biotype_as_type: true
