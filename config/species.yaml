# List of species to process (download_files.py -f / convert.sh -f).
#
# url: base URL of the MySQL dump directory (https:// or ftp://).
#      Optional; can be overridden by the URL given on the command line.
# species: production names, i.e. the directory name before `_core_`
#      (e.g. arabidopsis_thaliana for arabidopsis_thaliana_core_63_116_11).
#      A regular expression is accepted too (e.g. oryza_.* for every rice).
# entities: entity types to output (convert.sh only). Optional; default: all of
#      gene, transcript, translation, exon, exon_transcript, xref.
# exclude: entity types not to output. Optional.
# base_uri: base of the resource URIs (convert.sh only). Optional; default
#      http://rdf.ebi.ac.uk, giving http://rdf.ebi.ac.uk/resource/ensembl/...
# terms_uri: namespace of the terms: vocabulary. Optional; default
#      http://rdf.ebi.ac.uk/terms/ensembl/
url: https://ftp.ebi.ac.uk/pub/ensemblgenomes/plants/current/mysql/
species:
  - arabidopsis_thaliana
  - oryza_sativa
# entities: [gene, transcript, translation, xref]
# exclude: [exon]   # exon_transcript is then skipped too
# base_uri: http://purl.agrold.org
