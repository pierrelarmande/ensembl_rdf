# The 51 plant species integrated in AgroLD, as Ensembl Plants production names.
#
# Matched to Ensembl Plants release 63 (Ensembl 116) by NCBI taxon ID, from
# https://ftp.ebi.ac.uk/pub/ensemblgenomes/plants/current/species_EnsemblPlants.txt
# Where several genomes share a taxon ID (18 bread wheat cultivars, 7 barleys,
# 10 indica rices, ...), the reference genome is used: matching is anchored on
# `<name>_core_`, so `triticum_aestivum` does not pull in
# `triticum_aestivum_cadenza`.
url: https://ftp.ebi.ac.uk/pub/ensemblgenomes/plants/current/mysql/
model: agrold
base_uri: http://purl.agrold.org
